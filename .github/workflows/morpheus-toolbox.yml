name: MORPHEUS Tool Library
on:
  pull_request:
    paths:
      - "morpheus_tools/**"
      - "tests/test_morpheus_toolbox.py"
      - ".github/workflows/morpheus-toolbox.yml"
      - "AGENTS.md"
  push:
    paths:
      - "morpheus_tools/**"
      - "tests/test_morpheus_toolbox.py"
      - ".github/workflows/morpheus-toolbox.yml"
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate the catalog
        run: python -m morpheus_tools validate
      - name: Run deterministic toolbox tests
        run: python -m unittest discover -s tests -p 'test_morpheus_toolbox.py' -v
